name: Panhandle API HTTP smoke checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Panhandle and legacy API HTTP endpoints
        run: python tests/check_panhandle_http.py
