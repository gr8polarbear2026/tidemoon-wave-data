name: Refresh Florida Panhandle wave JSON
on:
  workflow_dispatch:
  schedule:
    - cron: '45 8,20 * * *'
permissions:
  contents: write
concurrency:
  group: panhandle-noaa-publish
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify coordinate lookup and freshness behavior
        run: node --test tests/panhandle_lookup.test.mjs
      - name: Install GRIB decoder and requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev
          python -m pip install -r requirements.txt
      - name: Test transient NOAA download retries
        run: python -m unittest discover -s tests -p test_noaa_download_retries.py -v
      - name: Validate and prepare all nine Panhandle forecasts
        run: python publish_panhandle.py --output panhandle --pause 10.5
      - name: Commit only validated Panhandle JSON (never legacy files)
        run: |
          git add panhandle/
          if git diff --cached --quiet; then
            echo "No changes in validated forecasts"
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Update verified Panhandle NOAA wave forecasts"
            git push origin HEAD:main
          fi
