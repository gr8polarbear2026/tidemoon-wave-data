name: Wave source validation
on:
  push:
    paths:
      - '*.py'
      - 'src/**'
      - 'tests/**'
      - 'requirements-panhandle.txt'
      - '.github/workflows/check-wave-source.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned NOAA decoder and dependencies
        run: |
          python -m pip install --only-binary=:all: --timeout 20 --retries 2 -r requirements-panhandle.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --test tests/*.test.mjs
