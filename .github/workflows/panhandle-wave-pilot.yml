name: Florida Panhandle NOAA wave pilot (nonpublishing)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NOAA GRIB dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev
          python -m pip install -r requirements.txt
      - name: Validate Panhandle test points without publishing
        run: python panhandle_pilot.py --output panhandle_results --hours 3,6 --pause 10.5
      - name: Build validated coordinate index
        if: always()
        run: |
          if [ -f panhandle_results/validation_report.json ]; then
            python validated_grid_lookup.py panhandle_results/validation_report.json --output panhandle_results/validated_grid_index.json
          fi
      - name: Save diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: florida-panhandle-wave-diagnostics
          path: panhandle_results/*.json
          if-no-files-found: warn
